<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Klassy Cafe Footer</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .footer {
            background-color: #ff554b;
            padding: 30px 0;
            color: white;
        }

        .social-icons {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .social-icons a {
            height: 45px;
            width: 45px;
            background-color: white;
            color: #ff554b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 20px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background-color: #333;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-icon {
            height: 55px;
            width: 55px;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo-text h2 {
            font-family: cursive;
            font-style: italic;
            font-size: 32px;
            margin: 0;
            line-height: 1;
        }

        .logo-text p {
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: bold;
            margin: 5px 0 0;
        }

        .copyright {
            text-align: right;
            font-size: 14px;
            font-weight: 500;
        }

        .copyright p {
            margin: 0;
            line-height: 25px;
        }

        /* Responsive CSS */
        @media (max-width: 767px) {
            .footer {
                padding: 30px 15px;
            }

            .social-icons {
                justify-content: center;
                margin-bottom: 25px;
                gap: 12px;
            }

            .logo {
                margin-bottom: 25px;
            }

            .copyright {
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            .social-icons a {
                height: 38px;
                width: 38px;
                font-size: 17px;
            }

            .logo-text h2 {
                font-size: 27px;
            }

            .logo-icon {
                height: 48px;
                width: 48px;
                font-size: 23px;
            }

            .copyright {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">

                <!-- Social Icons -->
                <div class="col-lg-4 col-md-4 col-12">
                    <div class="social-icons">
                        <a href="#" aria-label="Facebook">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>

                        <a href="#" aria-label="Twitter">
                            <i class="fa-brands fa-twitter"></i>
                        </a>

                        <a href="#" aria-label="LinkedIn">
                            <i class="fa-brands fa-linkedin-in"></i>
                        </a>

                        <a href="#" aria-label="Instagram">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </div>
                </div>

                <!-- Logo -->
                <div class="col-lg-4 col-md-4 col-12">
                    <div class="logo">
                        <div class="logo-icon">
                            <i class="fa-solid fa-utensils"></i>
                        </div>

                        <div class="logo-text">
                            <h2>Klassy</h2>
                            <p>SINCE 1990</p>
                        </div>
                    </div>
                </div>

                <!-- Copyright -->
                <div class="col-lg-4 col-md-4 col-12">
                    <div class="copyright">
                        <p>© Copyright Klassy Cafe Co.</p>
                        <p>Design: TemplateMo</p>
                    </div>
                </div>

            </div>
        </div>
    </footer>

    <script src="bootstrap.bundle.min.js"></script>

</body>
</html>
